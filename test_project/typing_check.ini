; Config for the parametric-Var typing test (testdjdatalog/typing_check.py).
; Enables the checks the main lenient config disables, so misuse of a typed
; Var is actually flagged. Used by `make typecheck-vars`.
[mypy]
python_version = 3.13
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
enable_error_code = arg-type
